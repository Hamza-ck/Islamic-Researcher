# Netlify Configuration for Islamic Research Folio (Frontend Directory Config)

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://thinkmeem-islamic-research-engine.hf.space"

# SPA Fallback Redirect
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache and Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
